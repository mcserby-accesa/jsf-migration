# Target conventions — human-authored, once per application.
#
# Copy this file to the application's working directory and fill it in. It is
# NOT part of this skeleton's defaults and it is NOT framework.yaml:
# framework.yaml tunes how the pipeline runs, this file states decisions about
# YOUR target system. c9 carries it into the spec pack at
# handover/target-conventions.yaml and hashes it.
#
# ---------------------------------------------------------------------------
# Two kinds of section, and the difference matters
# ---------------------------------------------------------------------------
#
# REQUIRED — `api:` and `identity:`. Read by c7 and c7b, which REFUSE to run
# if a required key is missing. They are inputs to a derivation: the OpenAPI
# document could not exist without them. A guessed convention is worse than a
# blocked step, because it is silently wrong in every fragment it touches.
#
# RECORDED — `process:` and `ui:`. Read by NOTHING. No step consumes them, no
# gate checks their contents, and a pack whose author left them empty passes
# every gate. They are here because the decisions they hold get made either
# way, and made per-screen or per-process by whoever arrives first they
# produce an application that disagrees with itself. The framework can record
# such a decision and cannot apply it, because applying it is implementation
# and implementation is out of scope (DECISIONS.md).
#
# What the framework will not do in either case is invent one.
#
# ---------------------------------------------------------------------------
# Why one file
# ---------------------------------------------------------------------------
#
# This was three files (api-conventions.yaml, ui-conventions.yaml, and a
# proposed process one). One file with sections is one thing to fill in, one
# hash in the manifest, and one place an implementer looks for "what did we
# decide about the target." The required/recorded distinction is carried by
# the section comments rather than by which file something lives in.

# ===========================================================================
# api:  REQUIRED — consumed by c7 (endpoint derivation) and c7b (bindings)
# ===========================================================================
api:

  # ---- Paths and naming ---------------------------------------------------

  # Prefix on every generated path. Include the version segment here if you
  # version in the path; leave the version out if you version by header.
  base_path: /api/v1

  # How a resource name is written in a path.
  #   kebab-case  -> /api/v1/leave-requests
  #   camelCase   -> /api/v1/leaveRequests
  #   snake_case  -> /api/v1/leave_requests
  path_case: kebab-case

  # Whether collection resources are plural (/leave-requests/{id}) or
  # singular (/leave-request/{id}).
  #   plural | singular
  resource_number: plural

  # How a legacy bean/service name maps to a resource name. The derivation
  # strips these suffixes before converting case — e.g. LeaveRequestService
  # with strip_suffixes [Service, Bean, DAO] becomes leave-requests.
  strip_suffixes: [Service, ServiceImpl, Bean, ManagedBean, DAO, Repository]

  # ---- Versioning ---------------------------------------------------------

  #   path   -> version lives in base_path above
  #   header -> version sent in a request header; name it below
  #   none   -> unversioned
  versioning: path
  version_header: ""          # only used when versioning: header

  # ---- Error shape --------------------------------------------------------

  # The response body returned for any non-2xx. Choose one:
  #   rfc7807   -> application/problem+json, RFC 7807 Problem Details
  #   custom    -> the shape declared in error_schema below
  error_style: rfc7807

  # Only used when error_style: custom. Declare the object's fields; the
  # derivation emits this as the error schema on every operation.
  error_schema: {}
  #   example:
  #   error_schema:
  #     code: string
  #     message: string
  #     details: array

  # Which HTTP status a legacy failure maps to. Extend as your legacy code's
  # exception vocabulary requires — an unmapped exception type is reported by
  # the derivation, never silently defaulted to 500.
  status_mapping:
    validation_failure: 400
    not_authenticated: 401
    not_authorized: 403
    not_found: 404
    conflict: 409
    unexpected: 500

  # ---- Pagination ---------------------------------------------------------

  # How a paginated collection is requested and returned.
  #   page-size    -> ?page=0&size=20
  #   offset-limit -> ?offset=0&limit=20
  #   cursor       -> ?cursor=<opaque>&limit=20
  pagination_style: page-size

  # Default page size when a screen's extracted data_tables entry does not
  # specify one. When it DOES specify one, the extracted value wins — that is
  # the point of extracting it (docs/phase-a-inventory.md, "Structural
  # skeletons"): the page that paginates at 10 must not hit an endpoint
  # defaulting to 20.
  default_page_size: 20

  # Envelope for a paginated response.
  #   wrapped -> { "items": [...], "total": n, "page": 0 }
  #   headers -> bare array body, totals in response headers
  pagination_envelope: wrapped

  # ---- Verb mapping -------------------------------------------------------

  # Legacy service methods do not announce their HTTP verb. The derivation
  # guesses from the method name using these prefix lists, and falls back to
  # a judgment call (recorded, with its reasoning) when no prefix matches.
  #
  # A method that maps to no CRUD verb at all — approve(), recalculate(),
  # submitForReview() — becomes an action sub-resource:
  #   POST /leave-requests/{id}/approve
  # rather than being forced into PUT. Set action_style: rpc instead if you
  # prefer a flat RPC-style surface.
  verb_prefixes:
    get:    [get, find, load, list, search, fetch, read, is, has]
    post:   [create, add, submit, register, start, send]
    put:    [update, save, edit, modify, set]
    delete: [delete, remove, cancel, destroy]

  #   sub-resource -> POST /leave-requests/{id}/approve
  #   rpc          -> POST /leave-requests/approve
  action_style: sub-resource

  # ---- Formatting ---------------------------------------------------------

  # The locale the target formats and parses values in, when a legacy
  # converter did not state one. The legacy converter's own `locale`
  # attribute, extracted into SCR.converters_validators, always wins over
  # this — this is the fallback for a converter that relied on the server's
  # default locale, which is a fact about the legacy deployment rather than
  # about the code.
  default_locale: en-US

  # Whether amounts and dates cross the API as locale-formatted strings or as
  # canonical machine values the client formats.
  #   canonical  -> ISO-8601 dates, unformatted decimals; client formats
  #   formatted  -> the server returns display strings
  value_transport: canonical

  # ---- Translation policy: page semantics -> API semantics ----------------
  #
  # A legacy JSF application expresses outcomes by serving pages: a
  # redisplayed form, an inline error page at HTTP 200, a redirect after
  # logout. A JSON API has no equivalent for any of these, so every such
  # scenario needs a decision before it can be checked against the
  # replacement. Stated here once, they are applied mechanically to every
  # behavior. Left unstated, they get decided per behavior at implementation
  # time, differently each time, by whoever reaches that scenario first.

  navigation_semantics:
    # What a legacy navigation outcome becomes in the target.
    #   client_route  -> the client routes without a server round-trip
    #   server_result -> the operation's response carries the next destination
    outcome_becomes: client_route

    # How a legacy view id maps to a client route path. The derivation strips
    # the extension and the listed prefixes, then applies path_case.
    #   e.g. /pages/leave/detail.xhtml -> /leave/detail
    view_id_to_route:
      strip_prefixes: [/pages, /faces]
      strip_extension: true

    # Whether a scenario asserting a full-page navigation (a plain href, a
    # redirect) is bindable at all in the target, or is recorded as
    # client-side-only. Almost always client_side_only for an SPA.
    #   client_side_only | rest
    full_page_navigation: client_side_only

# ===========================================================================
# identity:  REQUIRED — consumed by c7 and c7b
# ===========================================================================
#
# The legacy AUTHN node states what the legacy side HAD — often a container
# realm holding nothing this repository can see (credential_store: external).
# This section states what replaces it. The pilot's single largest invented
# artifact was an entire user/role entity, because nothing said who exists.
identity:

  # How the target authenticates. Emitted as the OpenAPI security scheme.
  #   bearer-jwt | session-cookie | oauth2 | none
  auth_style: bearer-jwt

  # Where the target's users, credentials, and roles come from.
  #   in_app        -> the replacement owns a user table; it must be built
  #   external_idp  -> an OIDC/SAML provider owns identity; the app consumes it
  #   unchanged     -> the same directory/realm the legacy app used
  identity_source: in_app

  # Whether the roles extracted from legacy AUTHZ nodes are carried onto the
  # generated operations as a security requirement.
  #   true  -> each operation declares the roles its legacy counterpart required
  #   false -> authorization is enforced elsewhere; the contract stays silent
  carry_legacy_roles: true

  # How a legacy role name maps to a target role/authority name. Identity is
  # the common default: the legacy vocabulary carries over unchanged. Set an
  # explicit map when the target renames or regroups them.
  #   identity | map
  role_mapping: identity
  role_map: {}
  #   example:
  #   role_map:
  #     LEAVE_MANAGER: ROLE_MANAGER

  # Whether the pack's derived operations assume seeded users exist for each
  # declared role. This does not seed anything — the framework builds nothing.
  # It records the expectation so that "there are no users" is a stated
  # consequence of a decision rather than something discovered at first run.
  expect_seeded_role_accounts: true

  # Where authorization is actually CHECKED in the target. The pack says which
  # roles each operation requires; it does not say what enforces that, and
  # left unstated the answer differs per behavior — some endpoints annotated,
  # some checked in a service, some relying on a filter nobody documented.
  #   method-annotation -> @PreAuthorize/@RolesAllowed on the operation impl
  #   filter-chain      -> a central request-matcher configuration
  #   gateway           -> enforced before the request reaches the service
  #   service-layer     -> checked inside the domain service
  enforcement_point: method-annotation

  # What becomes of a legacy web.xml <security-constraint> whose <url-pattern>
  # protected a server-rendered page. In an SPA there is no such URL left to
  # constrain, so the constraint has to land somewhere else or be dropped
  # deliberately.
  #   map-to-operations -> the constraint's roles are applied to every
  #                        operation derived from the screens under that
  #                        pattern (the usual answer)
  #   client-route-only -> the client refuses to route there; the API is
  #                        unprotected for those paths (rarely correct — say
  #                        so explicitly if you mean it)
  #   drop              -> the constraint does not carry over; each dropped
  #                        constraint is recorded as an open question
  url_constraint_policy: map-to-operations

  auth_semantics:
    # Status returned when an unauthenticated caller reaches a protected
    # operation. The legacy equivalent is usually "the login page is served
    # inline at 200".
    unauthenticated_response: 401

    # Status when an authenticated caller lacks the required role.
    unauthorized_response: 403

    # Whether the login page becomes a client route rather than a server
    # response. Almost always true for an SPA; false only if the target still
    # serves a login page server-side.
    login_page_is_client_route: true

    # The operations the contract should declare for authentication itself.
    # Emitted by c7 against the AUTHN node; leave the list empty if the target
    # authenticates entirely through an external IdP with no first-party
    # endpoints.
    operations:
      login:   { path: /auth/login,  verb: post }
      logout:  { path: /auth/logout, verb: post }
      current: { path: /auth/me,     verb: get }

    # How a caller proves logout succeeded, given that "redirected to
    # /login.xhtml" has no API equivalent. Recorded because it is the
    # assertion every logout scenario binds to.
    #   session_probe -> logout returns 2xx and a following `current` call
    #                    returns unauthenticated_response
    #   status_only   -> logout's own status is the whole assertion
    logout_evidence: session_probe

# ===========================================================================
# process:  RECORDED — consumed by nothing. Fill it in anyway.
# ===========================================================================
#
# The spec pack ships every .bpmn file byte-identically, on the premise that
# the implementer must run the originals. That premise is only true if
# something in the target can execute them, and NOTHING in this framework
# decides what. Leaving it unstated is how the first pilot's implementing
# agent removed the process engine entirely and reimplemented the
# orchestration ad hoc — a legitimate option, arrived at by deletion rather
# than by decision, with nothing recorded either way.
#
# Every PROC node therefore seeds a BLOCKING open question, and this section
# is where the answer goes. A process behavior cannot be built without it.
process:

  # What runs the processes in the target.
  #
  # A RECOMMENDED DEFAULT, not a mandate — same posture as
  # framework.yaml: legacy_test_seam, which recommends `service` and requires
  # per-application confirmation at the Phase 0 gate. Confirm this one the
  # same way; the framework does not choose your architecture.
  #
  #   operaton     The Camunda 7 community fork, embedded in the Spring Boot
  #                app (same JVM, no separate server, shares the app's
  #                transaction). RECOMMENDED for a Camunda 7 legacy app: it is
  #                the only option under which the pack's byte-identical
  #                .bpmn files stay runnable AND the engine is supported.
  #                Camunda 7 Community Edition reached end of life in October
  #                2025 (final release 7.24); Operaton exists because of that.
  #                Risk to weigh: the project is young — a compatibility fork
  #                of a mature codebase, not a mature project.
  #   camunda7-ee  Same semantics, supported to April 2030, licensed.
  #                Correct if you already hold a licence.
  #   camunda7-ce  The original community edition. EOL since October 2025 — no
  #                security patches. Recording this means accepting that.
  #   flowable     Embeddable and actively developed, shares Activiti ancestry
  #                with Camunda 7 so delegates and expressions are familiar.
  #                The .bpmn files need porting, not carrying: `camunda:`
  #                extension elements do not transfer.
  #   camunda8     NOT embeddable — a separate Zeebe cluster, @JobWorker
  #                instead of JavaDelegate, no shared transaction with the
  #                application database. Every service task and listener is
  #                rewritten. Set bpmn_disposition: port and expect a project.
  #   none         No engine. The processes become explicit orchestration
  #                (a state machine, or plain service code). Defensible for
  #                small processes; see the note below on what it obliges.
  target_engine: operaton

  # What happens to the .bpmn files the pack ships.
  #   run-as-shipped -> deployed to the target engine unchanged. Only
  #                     consistent with an engine that speaks Camunda 7
  #                     semantics (operaton, camunda7-*).
  #   port           -> migrated to the target engine's dialect; the shipped
  #                     files are the source, not the deliverable.
  #   reimplement    -> not deployed at all. The processes are rebuilt as
  #                     application code, and process/bindings.json stops
  #                     being a rewiring list and becomes the reimplementation
  #                     work list — every service task, listener and gateway
  #                     condition in it is something you must now write and
  #                     test yourself, including the gateway conditions a3
  #                     lifted into RULE nodes.
  bpmn_disposition: run-as-shipped

  # Only meaningful when target_engine: none. What replaces the engine.
  #   Free text — recorded, not interpreted.
  orchestration_replacement: ""
  #   examples: "Spring StateMachine, one machine per process"
  #             "explicit service orchestration, no state machine"

  # Whether the target keeps BPMN user tasks as a task list the user works
  # from, or folds them into ordinary screens. The legacy app's task list is
  # a screen like any other and was extracted as one; this records whether it
  # survives as a task-engine-backed concept.
  #   engine-task-list | screens-only
  user_task_model: engine-task-list

# ===========================================================================
# ui:  RECORDED — consumed by nothing. Fill it in anyway.
# ===========================================================================
#
# How the extracted layout facts (docs/phase-a-inventory.md, "Layout") map
# onto the target UI stack. The wireframe renderer deliberately IGNORES this:
# a wireframe depicts the LEGACY layout, and rendering it through the target's
# conventions would corrupt the one thing it is for.
ui:

  # The component library the replacement is built on. Free text — recorded,
  # not interpreted.
  component_library: ""
  #   examples: "Angular Material 17", "PrimeNG 17", "in-house design system"

  # The layout primitive containers map onto.
  #   css-grid | flexbox | library-grid
  layout_primitive: css-grid

  # Breakpoints, if the replacement is responsive. The legacy application
  # almost certainly was not — record that honestly rather than back-filling
  # breakpoints onto a fixed-width page and calling it preserved.
  responsive: true
  breakpoints:
    sm: 600px
    md: 960px
    lg: 1280px

  # One entry per container_kind in schemas/layout-tree.schema.json. The value
  # is whatever names the target construct — a component selector, a
  # directive, a CSS class. Recorded so every implementer of every screen
  # reaches for the same one.
  #
  # `custom` has no entry: an unclassifiable legacy container is a known gap
  # flagged for a human at review time, and a blanket mapping for it would
  # convert that flag back into silence.
  container_mapping:
    stack:         ""
    grid:          ""
    tabs:          ""
    accordion:     ""
    wizard-steps:  ""
    split:         ""
    toolbar:       ""
    dialog:        ""
    region:        ""
    table:         ""

  # One entry per component_kind. Same purpose as container_mapping.
  component_mapping:
    text:            ""
    multiline-text:  ""
    single-select:   ""
    multi-select:    ""
    date:            ""
    boolean-toggle:  ""
    numeric:         ""
    action:          ""
    link:            ""
    file-upload:     ""
    display-only:    ""

  # What happens to a container the legacy app collapsed by default.
  #   preserve | expand
  preserve_initial_collapse: preserve

  # What a legacy tab set becomes when the target is responsive and the tabs
  # do not fit.
  #   tabs | stepper | accordion | scrollable-tabs
  narrow_viewport_tabs: scrollable-tabs

  # Where labels sit, and what to do with a field whose legacy label_position
  # is `unspecified` (the source declared none and the legacy component
  # library's default applied).
  #   as-extracted -> honour each field's label_position; `unspecified` falls
  #                   back to default_label_position
  #   uniform      -> every field uses default_label_position regardless
  label_placement: as-extracted
  default_label_position: top

  # How width_class maps onto the grid. A legacy `fixed` width carries a
  # declared_width in the extraction; state whether the target honours it.
  #   honour | snap
  fixed_width_policy: snap

  # The legacy shell lives in a TPL node's nav_menu
  # (docs/phase-a-inventory.md, "The application shell").
  #   preserve | flatten | redesign
  shell_navigation: preserve

  # Whether menu items the legacy app hid by role are hidden or disabled in
  # the target, for items where the legacy behavior was not declared.
  #   hide | disable
  undeclared_role_visibility: hide

  # Recorded, never checked. This framework has no standing to verify that a
  # rebuild matched its source (DECISIONS.md, "Structural fidelity is the
  # implementer's call") and ships no validator that tries. Its value is that
  # the intent is written down once, so a reviewer comparing a rebuilt screen
  # against reference/screenshots/ knows which differences were the plan.
  #   structural -> containment, order, and conditionality are preserved;
  #                 appearance is the target design system's
  #   visual     -> the rebuild also aims to look like the legacy screen
  #   redesign   -> layout is redesigned; the extraction is background
  layout_intent: structural

  # Free text: anything a screen-by-screen implementer should know that the
  # fields above cannot express. Carried into the pack verbatim.
  notes: ""
