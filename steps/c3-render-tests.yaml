id: c3-render-tests
phase: C
kind: script
description: >
  Deterministically render one behavior's ACs and decision tables into every
  format in framework.yaml:spec_format (a list: gherkin | junit | playwright),
  per the mapping rules in templates/renderers/*.md. Never an LLM call — this
  is the mechanism that guarantees rendered formats can never hand-drift from
  the canonical BHV or from each other.

  playwright renders browser cases Phase D runs against the LEGACY application
  (templates/renderers/playwright.md, docs/phase-d-spec-validation.md). It is
  the same discipline applied one seam further out: hand-writing browser tests
  from the pack would breach principle 3 exactly as hand-translating Gherkin
  into JUnit would.
input:
  type: single_behavior
  source: one BHV-####.md, fully authored through c1/c2/c2b
  bound: exactly one behavior per call; deterministic template expansion,
    not an LLM step
output_schema: schemas/c3-render-tests.schema.json
validators:
  - re-rendering the same unchanged BHV-####.md produces byte-identical
    output (idempotence)
  - every AC/decision-table row in the source BHV is accounted for by the
    rendered output — either it has its own rendered scenario/test method,
    OR its decision_table_ref is non-empty and that table's own rendered
    Scenario Outline/@ParameterizedTest exists (per
    templates/renderers/*.md rule "decision_table_ref rows are not
    independently rendered") — a row satisfying neither is a silent drop
    (a row with a non-empty decision_table_ref used to be
    ambiguous between "rendered on its own" and "rendered via its table,"
    and the renderers resolved it inconsistently by hand)
  - when spec_format lists more than one format, every rendered format
    references the same set of source AC ids, with one stated exception —
    playwright omits scenarios whose scenario-bindings verdict is domain-only
    or not-observable, and records each omission with its reason. A browser
    case asserting something no browser can observe would report green and add
    to the count, which is worse than an absent one
  - every playwright locator is derived per templates/renderers/playwright.md's
    ordered rule — an exact client_id where one exists, else a suffix match
    carrying its fallback comment; never a text or positional locator
  - warn (do not fail) when spec_format includes playwright while
    spec_validation_scope is none, since those files would be rendered and
    then run by nothing
  - every emitted step, title, and Examples/@CsvSource cell passes text
    normalization (templates/renderers/gherkin.md, "Text normalization") —
    Markdown emphasis stripped, newlines collapsed, delimiters escaped
  - every scenario title and test-method name carries its scenario_id, so
    uniqueness holds by construction rather than by luck
  - the Feature description is emitted as comment lines, never as free text
    that a parser could read as a stray step declaration
escalate:
  trigger: not applicable
  action: >
    a rendering rule that can't mechanically express something the AC/table
    says is a bug in templates/renderers/*.md to fix, not a case for
    hand-translation or LLM fallback
idempotent: true
resumable: true
notes: >
  spec_format is consumed ONLY here — see framework.yaml's boundary comment.

  This step's validators check that the renderer applied its own rules.
  Whether the resulting file actually LOADS under a real parser is a
  different claim, and it is c3b's — see
  steps/c3b-verify-rendered-artifacts.yaml. Determinism and loadability were
  conflated in an earlier version, which meant the framework proved the
  first and shipped the second unchecked.
