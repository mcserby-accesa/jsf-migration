id: a7-lift-computation
phase: A
kind: llm
description: >
  Turn one derivation method — a method the Java AST scan flagged as
  computing a value from domain fields without performing I/O — into an
  explicit formula and a candidate RULE node stub, with a DERIVED_FROM edge
  back to the owning SVC node. The same mechanism as a3 and a6, applied to
  the one thing a coverage oracle cannot recover: a formula is not
  observable at the resolution acceptance scenarios sample it at. Knowing
  every branch of total() was exercised does not state the operand order,
  the rounding mode, or which intermediate is deliberately left unrounded.
  See docs/phase-a-inventory.md, "Value facts."
input:
  type: single_node
  source: nodes.jsonl, kind == "service", one entry of
    raw_facts.derivation_methods
  fields: [svc_id, method_name, signature, method_body, referenced_fields,
    column_facts]
  bound: exactly one method per call
  note: >
    method_body is resolved from the method's legacy_refs at call time by
    the orchestrator, the same way a6 resolves body_ref. column_facts is the
    precision/scale/value_domain of every DB column the referenced fields
    map to — supplied because a formula's rounding behavior is only
    interpretable against the exactness of the values it operates on, and
    the extractor already has those facts.
prompt: prompts/a7-lift-computation.md
output_schema: schemas/a7-lift-computation.schema.json
validators:
  - source SVC node id in the response exists in nodes.jsonl and the named
    method exists in its public_methods or derivation_methods
  - every identifier in the formula resolves to a parameter, a field, or a
    constant present in method_body — no invented terms
  - rounding_mode and scale are either both stated or both explicitly null;
    a formula that rounds without saying how is not a lifted formula
  - a DERIVED_FROM edge from the new RULE id to the source SVC node id is
    present in the output
  - confidence field present and in [0,1]
escalate:
  trigger: 3 consecutive schema-validation failures, OR confidence < 0.5 twice
  action: >
    retry with the full bodies of every method this one calls (a formula
    delegating to a helper cannot be stated from the caller alone), plus the
    owning class's constants; log the escalation event
idempotent: true
resumable: true
notes: >
  This is the one lift whose source IS visible to c4's coverage oracle, and
  that exception is deliberate. The other lifts exist because JaCoCo cannot
  see EL or a trigger body; this one exists because coverage proves a branch
  ran without stating what it computed. Both are the same failure from the
  implementer's side — a fact that reaches the pack only as whatever the
  scenarios happened to pin down.

  Every flagged derivation method must reach this step: a5's exit gate
  checks that each derivation_methods entry has a corresponding lifted RULE,
  so a method flagged and then skipped blocks Phase A rather than silently
  shipping a formula-shaped hole.

  A formula whose result feeds a column with a scale the formula itself
  doesn't round to is not an error here — it is the finding. Emit it as
  lifted, with unrounded_intermediate set, so the mismatch reaches the pack
  as a stated fact rather than as an ORM's silent default at implementation
  time.
