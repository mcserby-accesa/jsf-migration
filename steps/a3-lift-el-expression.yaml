id: a3-lift-el-expression
phase: A
tier: S
description: >
  Turn one raw EL node (a rendered/disabled/required/value expression, or a
  BPMN gateway condition_expr) into a plain-language rule description and a
  candidate RULE node stub, with a DERIVED_FROM edge back to the source.
  This is the mechanism that keeps JSF view-layer logic — invisible to
  JaCoCo — from silently disappearing from the spec.
input:
  type: single_node
  source: nodes.jsonl, kind == "el" (or TASK nodes with a non-empty condition_expr)
  fields: [id, raw_expression, attribute, attached_component_id, attached_screen]
  bound: exactly one EL/condition_expr node per call
prompt: prompts/a3-lift-el-expression.md
output_schema: schemas/a3-lift-el-expression.schema.json
validators:
  - source EL/TASK node id in the response exists in nodes.jsonl
  - proposed RULE node's description references only property names present
    in raw_expression (no invented conditions)
  - a DERIVED_FROM edge from the new RULE id to the source node id is present
    in the output
  - confidence field present and in [0,1]
escalate:
  trigger: 3 consecutive schema-validation failures, OR confidence < 0.5 twice
  action: retry at tier M with the attached screen's full form_fields list as
    extra context; log the escalation event
idempotent: true
resumable: true
notes: >
  Output RULE nodes are candidates — they enter nodes.jsonl with
  extraction_confidence "certain" (the lift itself doesn't need a second
  confirmation pass; a3's schema already requires the description to be
  traceable to the literal expression) but are not yet claimed by any
  behavior until Phase B links them via a GUARDS/COVERS edge.
