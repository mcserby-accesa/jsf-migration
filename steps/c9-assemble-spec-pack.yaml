id: c9-assemble-spec-pack
phase: C
kind: script
description: >
  Assemble the spec pack (docs/spec-pack.md): copy the originals, generate
  every projection, merge c7/c8's operation fragments into one OpenAPI
  document, copy the .bpmn files byte-identically, derive
  behaviors/order.json, behaviors/ownership.json, behaviors/step-index.json,
  behaviors/scenario-bindings.json, data/fixture-order.json and
  auth/identity.json, render views/wireframes/ from views/pages.json, copy
  a8's captured screen references and their index, carry
  handover/target-conventions.yaml, seed
  triage/open-questions.jsonl and an empty behaviors/progress.jsonl, write
  manifest.json and the generated README index, then run the
  spec_pack_complete gate. This is the framework's terminal step — its
  output is the deliverable.
input:
  type: whole_application
  source: >
    nodes.jsonl, edges.jsonl, every BHV-####.md that passed c6, c3's rendered
    tests, c3b's verification reports, the application triage log, c7/c8's
    operation fragments and client_side_only verdicts, c7b's scenario
    bindings, a8's capture report and the captured images, the legacy
    repository's .bpmn files, framework.yaml, target-conventions.yaml
  bound: not applicable (deterministic script over the whole application)
output_schema: schemas/c9-assemble-spec-pack.schema.json
validators:
  - spec_pack_complete
  - projection_regenerates_identically
  - bpmn_copied_verbatim
  - openapi_merge_consistent
  - endpoint_contract_complete
  - dependency_order_derivable
  - no_legacy_source_in_pack
  - rendered_artifacts_parse
  - rendered_scenario_titles_unique
  - step_text_is_plain_text
  - step_index_complete
  - scenario_surface_bound
  - value_facts_complete
  - layout_tree_complete
  - wireframe_renders_for_every_screen
  - screen_reference_captured
  - identity_model_present
  - open_questions_well_formed
wireframe_rendering:
  description: >
    views/wireframes/SCR-####.txt and TPL-####.txt are projections of
    views/pages.json, rendered by the deterministic mapping in
    templates/renderers/wireframe.md. They introduce no fact: anything true
    in a wireframe and absent from the layout_tree it came from is a renderer
    bug. They exist because a nested JSON tree carries the layout correctly
    and buries it — a reviewer checking the extraction against the legacy
    screen, and an implementer reading text rather than images, both need it
    arranged so it can be read at a glance.

    Rendered at a fixed 100 columns, deliberately not configurable: a
    projection whose bytes depend on a parameter cannot be diffed across
    re-runs, which is most of what it is for. Covered by
    projection_regenerates_identically like every other projection.
screen_references:
  description: >
    reference/screenshots/ is copied from a8's output and indexed by a8's own
    report; both are recorded in the manifest with kind "reference". They are
    NON-NORMATIVE: no gate parses an image, no projection derives from one,
    and the completeness gate checks only that the index is consistent with
    what is on disk and that every active SCR is either captured or recorded
    with a reason. A consumer that cannot read images loses nothing the pack
    asserts.

    That property is deliberate and load-bearing in reverse: if a later step
    ever needs to read a screenshot, the fact it needs belongs in layout_tree
    instead, and the correct fix is to extend a1 — the same rule that governs
    legacy source (DECISIONS.md, principle 5).

    Their sha256 is recorded at handover for tamper-evidence, and
    re-capturing is NOT required to reproduce it — see
    steps/a8-capture-screen-references.yaml.
carried_inputs:
  description: >
    handover/target-conventions.yaml (templates/target-conventions.yaml) is
    copied verbatim and hashed. Its `api:` and `identity:` sections are
    REQUIRED — c7 already refused to run without them, so a pack cannot reach
    this step without them. Its `process:` and `ui:` sections are RECORDED:
    no step reads them, and this step notes per-section in
    conventions_sections_recorded whether each was authored.

    That asymmetry is the point. A recorded-only section holds a decision the
    framework can carry and cannot apply, because applying it is
    implementation. A pack whose author left `process:` empty passes every
    gate — but the PROC nodes' blocking open questions are still there,
    unanswered, which is what a handover conversation is for.
order_derivation:
  description: >
    behaviors/order.json (schemas/order.schema.json) is a projection of the
    graph, not a plan. Behavior X depends on behavior Y when a node X covers
    has an edge to a node Y covers, and X != Y. Edge types treated as
    dependencies: INVOKES, READS, WRITES, RENDERS, STARTS, SCHEDULES —
    recorded in the output so the derivation is auditable. Cycles are
    condensed into cycle_groups and reported, NEVER broken by the generator;
    a cycle in a legacy application is a real finding, and choosing where to
    cut it is a human decision. wave is longest-path depth over the condensed
    graph: everything in one wave can be worked concurrently.
  progress_file: >
    behaviors/progress.jsonl (schemas/progress.schema.json) is seeded EMPTY
    and is the one mutable file in the pack. It is excluded from
    projection_regenerates_identically, from every hash in manifest.json, and
    from the completeness gate — this framework defines its shape and writes
    nothing into it. Append-only, because concurrent agents appending is safe
    where concurrent agents rewriting a mutable file silently drops claims.
ownership_derivation:
  description: >
    behaviors/ownership.json (schemas/ownership.schema.json) and
    behaviors/step-index.json (schemas/step-index.schema.json) are
    projections, derived by the same rule and recording it: for a node
    covered by several behaviors, or a step text rendered by several, the
    owner is the covering behavior in the earliest order.json wave, ties
    broken by lowest behavior id. Deterministic, so re-generating the pack
    picks the same owner; recorded, so the choice is auditable rather than
    asserted. Nodes and step texts with exactly one user are omitted from
    ownership.json — their ownership was never in question — but every step
    text appears in step-index.json, shared or not, because that file is
    also how an implementer looks up whether a step already has a
    definition.
open_questions_seeding:
  description: >
    triage/open-questions.jsonl (schemas/open-questions.schema.json) is an
    original, seeded here and append-only thereafter. This step AUTHORS
    nothing: every entry is mechanically derived from a state an upstream
    step already recorded — a null value_domain, a lift with
    open_value_domain, an AUTHN credential_store of external, a c7b binding
    of not-observable or preserves_legacy_meaning false, a c8-judged
    endpoint, a Step 5b overturned dead_code verdict. OQ ids are assigned in
    a stable order (category, then subject id) so a re-run reproduces them,
    and are never reused or renumbered.

    Two seeds are this step's own, because the state they read is the
    conventions file rather than an upstream step's output:

    - Every active PROC node seeds an undecided_process_engine entry with
      blocks: true when target-conventions.yaml has no `process:` section, or
      its target_engine is unset. The pack ships every .bpmn byte-identically
      on the premise that the implementer runs the originals; nothing in this
      framework decides what executes them, and the first pilot's
      implementing agent resolved that silence by deleting the engine and
      reimplementing the orchestration ad hoc. "No engine" is a legitimate
      answer (process.target_engine: none) — arriving at it by deletion, with
      nothing recorded, is not. It blocks because a process behavior cannot
      be built without the answer.
    - Every AUTHZ node with constraint_type web.xml seeds an
      unenforced_url_constraint entry when identity.url_constraint_policy is
      `drop`, or when the screens under its url_pattern produced no
      operations for its roles to land on. A URL pattern protecting a
      server-rendered page has no equivalent in an SPA, and a constraint that
      quietly failed to carry over is indistinguishable from one that was
      never needed.

    Neither is authored: both read a state that already exists. What this
    step adds is that the state becomes a question with a place to record the
    answer.

    The gate checks that seeded entries are well-formed, NOT that they are
    answered. A pack ships with open questions by design; what it must not
    ship is an open question nobody wrote down. The resolution field is the
    implementer's, and this step never writes it — same posture as
    progress.jsonl.
escalate:
  trigger: not applicable
  action: >
    a gate failure blocks handover and names the missing or inconsistent
    part; it is fixed by re-running the step that owns that part, never by
    hand-editing the assembled pack — a hand-edited pack no longer
    regenerates, which is the one property the whole structure depends on
idempotent: true
resumable: true
notes: >
  Every file this step writes is either copied from an original or generated
  from one. It authors nothing. That is what makes re-running it after any
  upstream change safe, and what lets projection_regenerates_identically be a
  meaningful check rather than a tautology.

  Legacy source files are never copied into the pack. If a consumer of the
  pack needs a fact that only exists in .xhtml or a class body, the correct
  fix is to extend the Phase A extractor that should have captured it — not
  to widen this step's copy list. See DECISIONS.md, principle 5. The two
  exceptions this step does copy — .bpmn files and captured screenshots —
  are carried artifacts rather than source standing in for a spec: nothing
  can be lifted out of an image, and the .bpmn files are shipped precisely
  because the implementer must run the originals. A rendered stylesheet or a
  saved HTML rendering of a page would be source in the sense the rule
  means, whichever directory it was filed under, and is prohibited.
