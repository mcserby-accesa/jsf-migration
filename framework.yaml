# Framework parameters.
#
# Rule for every parameter in this file: it is consumed at exactly ONE
# boundary (one step, one renderer). That is what makes each choice
# reversible without leaking into upstream artifacts. The "consumed_by"
# comment on each parameter is not decoration — it is the enforcement
# mechanism. If you find a second place in the codebase reading one of
# these values, that is a bug in the implementation, not a new feature.

# Output format(s) for rendered executable specs. A LIST — one or more of:
#   gherkin | junit | playwright
# Consumed ONLY by steps/c3-render-tests.yaml. Nothing upstream of rendering
# (inventory, behavior specs, acceptance criteria, decision tables) knows or
# cares about this value. Changing it produces different files in
# examples/-shaped output directories; it never changes a BHV-####.md.
#
# Default is [gherkin] per DECISIONS.md #5 (more legible to non-engineers
# reviewing behavior specs during triage); junit is equally first-class.
#
# `playwright` renders browser cases that Phase D runs against the LEGACY
# application (templates/renderers/playwright.md). Include it only if
# spec_validation_scope below is not `none` — rendering browser specs nothing
# runs produces files that rot. c3 warns on that combination rather than
# failing, since rendering them to read is a legitimate if unusual choice.
#
# This was a scalar with a `both` value until Phase D was authored. `both`
# stopped being meaningful with a third format, and enumerating pairs
# (gherkin_and_junit, ...) would grow quadratically. A list says the same
# thing without the combinatorics.
spec_format: [gherkin]

# The BPMN engine the LEGACY application runs.
#   e.g. camunda7 | camunda8 | flowable | jbpm | none
# Consumed ONLY by steps/b3-draft-behavior-boundary.yaml, which copies it
# verbatim into process-type BHV frontmatter as a traceability label. It is
# also recorded in the spec pack manifest, so a reader knows which engine's
# execution semantics the carried-over .bpmn files assume.
#
# There is deliberately NO bpmn_target_engine. The pack ships the .bpmn files
# exactly as discovered; getting them running on whatever engine the
# replacement uses is the implementer's work, and no step here would read
# such a parameter. An earlier version made engine continuity a checked
# Phase 0 precondition — that was correct only while the framework claimed
# to deploy processes itself, which it no longer does.
bpmn_source_engine: camunda7

# Test seam(s). Split into a legacy/target pair — the
# legacy JSF app and the target Spring Boot/Angular app are different
# systems with different seams; one parameter cannot describe both.
#
# legacy_test_seam: rest | service | ui
#   Which layer c3's legacy render and c4 exercise against the *legacy* app.
#   Consumed by templates/renderers/junit.md (selects skeleton shape),
#   steps/c4-run-coverage-oracle.yaml (runs against it), and validated for
#   reachability (not reinterpreted) by Phase 0's entry gate: these three
#   reads are the gate checking the same choice that c3/c4 later consume,
#   not three independent meanings of the parameter.
#   Default is `service`, not `rest` — most legacy JSF apps are
#   postback/ViewState-driven with no REST boundary; `rest` assumes a
#   boundary that typically doesn't exist, and `ui` is where Phase C's
#   effort explodes (driving ViewState/partial-ajax through a browser).
#   `service` is the default because it is invocable outside the web
#   container and reaches the backing beans where JSF business logic lives.
#   Confirm which seam actually exists per-application at the Phase 0 gate
#   (docs/phase-0-environment.md) — do not assume this default holds.
legacy_test_seam: service
#
# There is deliberately no target-side seam parameter. The framework never
# tests the target system — implementation is out of scope (DECISIONS.md,
# "Phase D is spec validation, not implementation"). Phase D's browser-driven
# validation runs against the *legacy* app, a fixed seam rather than a choice.
#
# How much of the spec Phase D validates against the running legacy app.
#   none | view_and_high_risk | full
# Consumed ONLY by steps/d1-run-spec-validation.yaml. Declared here now that
# that step exists — it was deliberately withheld while Phase D was designed
# but not authored, because every parameter in this file has a real consumer.
#
#   none                Nothing runs. A legitimate choice: whether validating
#                       the spec is worth the investment is your call, and the
#                       framework has no standing to insist. It is NOT silent —
#                       d1 still emits an out_of_scope outcome per lifted rule,
#                       c9 records the counts in the manifest, and each
#                       unvalidated rule seeds an open-questions entry. Same
#                       discipline as not_sampled in the triage log.
#   view_and_high_risk  DEFAULT. Every behavior covering a RULE derived from an
#                       EL or NAV node, plus anything high_risk_override: true.
#                       Those are exactly the behaviors whose evidence c4
#                       structurally cannot produce: at legacy_test_seam:
#                       service no page is rendered, so every EL-derived rule
#                       and every render_guard on a layout tree is turned into
#                       a test and then executed by nothing.
#   full                Every behavior. Buys a second look at scenarios that
#                       already have coverage-backed evidence, at the cost
#                       docs/phase-0-environment.md warns about for the ui
#                       seam — driving JSF ViewState and partial-ajax through
#                       a browser is where the effort goes.
#
# Record the choice and its reason in the Phase 0 checklist, beside
# legacy_test_seam. See docs/phase-d-spec-validation.md.
spec_validation_scope: view_and_high_risk

# Where nodes.jsonl / edges.jsonl get loaded for querying.
#   duckdb | sqlite
# Consumed ONLY by the graph-load step implied in steps/a1-extract-inventory.yaml
# (the "load" sub-step after raw extraction). nodes.jsonl and edges.jsonl
# remain the source of truth regardless of this value; this only changes
# which query engine reads them.
graph_store: duckdb

# Coverage tool used for the Phase C completeness oracle.
#   jacoco | cobertura | (other JVM coverage tool)
# Consumed by steps/c4-run-coverage-oracle.yaml for the real run, and
# checked (not reinterpreted) by Phase 0's entry gate, which proves once
# that this tool actually attaches and emits a report before Phase B
# produces fifty behaviors on the strength of an untested assumption.
# Everything upstream (acceptance criteria, decision tables, rendered tests)
# is written without knowledge of the coverage tool.
coverage_tool: jacoco

# Tool used to reduce configuration-combinatorics decision tables to a
# pairwise-covering subset.
#   pict | acts
# Consumed ONLY by steps/c2b-pairwise-reduce.yaml. The full decision table
# produced by c2-build-decision-table is tool-agnostic; only the reduction
# step reads this value.
combinatorial_reducer: pict

# Which model runs which step is NOT specified here — it is the implementing
# team's choice. Each steps/*.yaml declares `kind: llm` or `kind: script`,
# and nothing beyond that. Every model-driven step is deliberately shaped to
# need only a small model (one bounded input, one judgment, schema-validated
# output — see DECISIONS.md principle 4), so a team can run the pipeline
# cheaply; but that is a property of how the steps are decomposed, not a
# configuration this file enforces. Prompts are plain text plus a "return
# JSON matching this schema" instruction, using no vendor-specific tool-use
# or structured-output feature, so any comparable model can fill any slot.
